  <main id="main">
    <div class="container">

      <section class="index-hero index-hero--statement" aria-labelledby="contact-title">
        <div>
          <h1 class="index-hero__title" id="contact-title">Let's talk.</h1>
          <p class="index-hero__lead">
            Tell me a little about the work, and I'll get back to you.
          </p>
        </div>
      </section>

      <section class="section" aria-label="Contact form">
        <form class="grid" method="post" action="send_mail.php" id="contactForm">
          <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">

          <div class="field span-4">
            <label class="field__label" for="contact-name">Name</label>
            <input class="field__control" id="contact-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field span-4">
            <label class="field__label" for="contact-email">Email</label>
            <input class="field__control" id="contact-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field span-8">
            <label class="field__label" for="contact-message">Message</label>
            <textarea class="field__control" id="contact-message" name="message" rows="6" required></textarea>
          </div>
          <div class="span-8 contact__form-actions">
            <button class="button" type="submit">Send message</button>
            <p class="contact__form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

    </div>
  </main>
