---
# cPanel Git Version Control deployment.
#
# This repo is the dev source: it has the token JSON, docs, and
# tooling alongside the actual site. Only the servable files below
# get copied into public_html — dev-only trees never touch the web
# root. $HOME is set by cPanel to the account home directory, so
# this works without hardcoding a username.
#
# One-time setup, in cPanel:
#   1. Git™ Version Control → Create → clone this repo's GitHub URL
#      to a path OUTSIDE public_html (e.g. ~/repositories/hobbs.design).
#   2. After each push to main: open that repo in cPanel → Manage →
#      "Update from Remote" (pulls the new commit), then
#      "Deploy HEAD Commit" (runs the tasks below).
#
# There is no PHP on this site any more, and no server-side anything:
# it is static files. The contact form is gone — it could not deliver
# from this host (outbound SMTP blocked for PHP, mail on Microsoft 365
# behind Proofpoint, DMARC p=reject) and told visitors otherwise.
# Contact is a mailto now.
#
# NOTE: these tasks only copy. They never delete, so a file removed
# from this repo stays in public_html until it is deleted there by
# hand.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/cp -R index.html $DEPLOYPATH
    - /bin/cp -R about.html $DEPLOYPATH
    - /bin/cp -R resume.html $DEPLOYPATH
    - /bin/cp -R contact.html $DEPLOYPATH
    - /bin/cp -R terafina.html $DEPLOYPATH
    - /bin/cp -R fabrication.html $DEPLOYPATH
    - /bin/cp -R proof.html $DEPLOYPATH
    - /bin/cp -R rumi.html $DEPLOYPATH
    - /bin/cp -R frictionless.html $DEPLOYPATH
    - /bin/cp -R groundwork.html $DEPLOYPATH
    - /bin/cp -R foundations.html $DEPLOYPATH
    - /bin/cp -R components.html $DEPLOYPATH
    - /bin/cp -R favicon.svg $DEPLOYPATH
    - /bin/cp -R robots.txt $DEPLOYPATH
    - /bin/cp -R sitemap.xml $DEPLOYPATH
    - /bin/cp -R Mark-Hobbs_Resume.pdf $DEPLOYPATH
    - /bin/cp -R dist $DEPLOYPATH
    - /bin/cp -R src $DEPLOYPATH
    - /bin/cp -R images $DEPLOYPATH
