<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="grid-title">
  <title id="grid-title">The twelve column grid of a case study section, showing the heading block, its subgrid columns, the statement hung in columns five to twelve, and the empty spacer spans</title>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      fill: rgba(15, 15, 15, 0.6);
    }
    .num { text-anchor: middle; font-size: 10px; }
    .track { fill: rgba(15, 15, 15, 0.05); }
    .box { stroke: #cccccc; stroke-width: 1; fill: none; }
    .box--sub { stroke-dasharray: 4 4; }
    .spacer { stroke: rgba(15, 15, 15, 0.25); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
    .bar { fill: rgba(15, 15, 15, 0.14); }
    .accent { stroke: #c11406; stroke-width: 1; fill: none; }
    .accent-text { fill: #c11406; }

    @media (prefers-color-scheme: dark) {
      text { fill: rgba(245, 245, 244, 0.6); }
      .track { fill: rgba(245, 245, 244, 0.07); }
      .box { stroke: #686b70; }
      .spacer { stroke: rgba(245, 245, 244, 0.3); }
      .bar { fill: rgba(245, 245, 244, 0.18); }
      .accent { stroke: #ff7a5c; }
      .accent-text { fill: #ff7a5c; }
    }
  </style>

  <!-- column numbers -->
  <g class="num">
    <text x="72" y="48">01</text>
    <text x="168" y="48">02</text>
    <text x="264" y="48">03</text>
    <text x="360" y="48">04</text>
    <text x="456" y="48">05</text>
    <text x="552" y="48">06</text>
    <text x="648" y="48">07</text>
    <text x="744" y="48">08</text>
    <text x="840" y="48">09</text>
    <text x="936" y="48">10</text>
    <text x="1032" y="48">11</text>
    <text x="1128" y="48">12</text>
  </g>

  <!-- the twelve tracks -->
  <g class="track">
    <rect x="40" y="64" width="64" height="392"/>
    <rect x="136" y="64" width="64" height="392"/>
    <rect x="232" y="64" width="64" height="392"/>
    <rect x="328" y="64" width="64" height="392"/>
    <rect x="424" y="64" width="64" height="392"/>
    <rect x="520" y="64" width="64" height="392"/>
    <rect x="616" y="64" width="64" height="392"/>
    <rect x="712" y="64" width="64" height="392"/>
    <rect x="808" y="64" width="64" height="392"/>
    <rect x="904" y="64" width="64" height="392"/>
    <rect x="1000" y="64" width="64" height="392"/>
    <rect x="1096" y="64" width="64" height="392"/>
  </g>

  <!-- row A — the section heading, and the spacer that holds the right side open -->
  <rect class="box" x="40" y="88" width="736" height="56"/>
  <text x="56" y="112">h2 · .span-8</text>
  <rect class="bar" x="56" y="120" width="480" height="10"/>
  <rect class="spacer" x="808" y="88" width="352" height="56"/>
  <text x="824" y="120">empty .span-4</text>

  <!-- row B — the supporting columns, on a subgrid of the block above -->
  <rect class="box box--sub" x="40" y="160" width="736" height="80"/>
  <text x="56" y="184">.span-8 .align  ·  subgrid</text>
  <rect class="box" x="40" y="192" width="352" height="40"/>
  <text x="56" y="216">p .span-4</text>
  <rect class="box" x="424" y="192" width="352" height="40"/>
  <text x="440" y="216">p .span-4</text>

  <!-- row C — the h3 statement, hung in the right eight -->
  <rect class="spacer" x="40" y="264" width="352" height="72"/>
  <text x="56" y="296">empty .span-4</text>
  <rect class="accent" x="424" y="264" width="736" height="72"/>
  <text class="accent-text" x="440" y="288">h3 · .span-8</text>
  <rect class="bar" x="440" y="300" width="600" height="12"/>

  <!-- row D — body copy under the statement -->
  <rect class="spacer" x="40" y="360" width="352" height="72"/>
  <text x="56" y="392">empty .span-4</text>
  <rect class="box" x="424" y="360" width="352" height="72"/>
  <text x="440" y="384">p .span-4</text>
  <rect class="bar" x="440" y="396" width="280" height="8"/>
  <rect class="bar" x="440" y="412" width="240" height="8"/>
  <rect class="box" x="808" y="360" width="352" height="72"/>
  <text x="824" y="384">p .span-4</text>
  <rect class="bar" x="824" y="396" width="280" height="8"/>
  <rect class="bar" x="824" y="412" width="216" height="8"/>

  <text x="40" y="496">The measure is asymmetric on purpose. Headings hang left, the argument hangs right, and both sit on the same twelve tracks.</text>
  <text x="40" y="516">.align re-exposes the parent's tracks with subgrid, so a .span-4 inside a .span-8 lands on the real column, not on an even split of the block.</text>
  <text x="40" y="536">The empty spans are how a block gets pushed into a later column. Below 1024px they have no job left, so grid.css hides them rather than leaving stray row gaps.</text>
</svg>
