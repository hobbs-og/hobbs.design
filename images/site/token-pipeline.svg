<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="pipeline-title">
  <title id="pipeline-title">The three token layers, base to semantic to component, compiling to one generated stylesheet, with a single value traced across all four</title>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      fill: rgba(15, 15, 15, 0.6);
    }
    .name { font-size: 13px; fill: #0f0f0f; letter-spacing: 0.06em; }
    .num { font-size: 11px; text-anchor: end; }
    .code { fill: #0f0f0f; }
    .box { stroke: #cccccc; stroke-width: 1; fill: none; }
    .hair { stroke: #cccccc; stroke-width: 1; fill: none; }
    .flow { stroke: rgba(15, 15, 15, 0.6); stroke-width: 1.5; fill: none; }
    .flow-tip { fill: rgba(15, 15, 15, 0.6); }
    .deny { stroke: rgba(15, 15, 15, 0.35); stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
    .deny-mark { stroke: #c11406; stroke-width: 1.5; }
    .trace { fill: #c11406; font-size: 12px; }
    .trace-box { stroke: #c11406; stroke-width: 1; fill: none; }

    @media (prefers-color-scheme: dark) {
      text { fill: rgba(245, 245, 244, 0.6); }
      .name, .code { fill: #f5f5f4; }
      .box, .hair { stroke: #686b70; }
      .flow { stroke: rgba(245, 245, 244, 0.6); }
      .flow-tip { fill: rgba(245, 245, 244, 0.6); }
      .deny { stroke: rgba(245, 245, 244, 0.4); }
      .deny-mark { stroke: #ff7a5c; }
      .trace { fill: #ff7a5c; }
      .trace-box { stroke: #ff7a5c; }
    }
  </style>

  <!-- 01 base -->
  <rect class="box" x="8" y="64" width="272" height="208"/>
  <text class="name" x="32" y="96">tokens/base/</text>
  <text class="num" x="256" y="96">01</text>
  <line class="hair" x1="32" y1="112" x2="256" y2="112"/>
  <text x="32" y="136">Raw values. The only layer</text>
  <text x="32" y="152">allowed to hold one.</text>
  <text class="code" x="32" y="192">"500": { "$value": "#E12A09" }</text>
  <text class="code" x="32" y="208">"600": { "$value": "#C11406" }</text>
  <text x="32" y="248">A red. It doesn't know</text>
  <text x="32" y="264">it's a link.</text>

  <!-- 02 semantic -->
  <rect class="box" x="312" y="64" width="272" height="208"/>
  <text class="name" x="336" y="96">tokens/semantic/</text>
  <text class="num" x="560" y="96">02</text>
  <line class="hair" x1="336" y1="112" x2="560" y2="112"/>
  <text x="336" y="136">Roles, named element-</text>
  <text x="336" y="152">property-role. Aliases only.</text>
  <text class="code" x="336" y="192">text.color.link:</text>
  <text class="code" x="336" y="208">{color.brand.primary.600}</text>
  <text x="336" y="248">Now it knows. A literal</text>
  <text x="336" y="264">hex here is a bug.</text>

  <!-- 03 component -->
  <rect class="box" x="616" y="64" width="272" height="208"/>
  <text class="name" x="640" y="96">tokens/component/</text>
  <text class="num" x="864" y="96">03</text>
  <line class="hair" x1="640" y1="112" x2="864" y2="112"/>
  <text x="640" y="136">Per component, added once</text>
  <text x="640" y="152">a component earns them.</text>
  <text class="code" x="640" y="192">case-hero.color.background:</text>
  <text class="code" x="640" y="208">{surface.color.card}</text>
  <text x="640" y="248">Variants swap these,</text>
  <text x="640" y="264">never the rules.</text>

  <!-- output -->
  <rect class="box" x="920" y="64" width="272" height="208"/>
  <text class="name" x="944" y="96">dist/tokens.css</text>
  <text class="num" x="1168" y="96">OUT</text>
  <line class="hair" x1="944" y1="112" x2="1168" y2="112"/>
  <text x="944" y="136">Generated by Style</text>
  <text x="944" y="152">Dictionary. Never hand-edited.</text>
  <text class="code" x="944" y="192">--text-color-link:</text>
  <text class="code" x="944" y="208">var(--color-brand-primary-600)</text>
  <text x="944" y="248">The chain survives compilation,</text>
  <text x="944" y="264">so DevTools can read it.</text>

  <!-- flow -->
  <g class="flow">
    <path d="M284 168 H 304"/>
    <path d="M588 168 H 608"/>
    <path d="M892 168 H 912"/>
  </g>
  <g class="flow-tip">
    <polygon points="304,164 312,168 304,172"/>
    <polygon points="608,164 616,168 608,172"/>
    <polygon points="912,164 920,168 912,172"/>
  </g>

  <!-- the path that isn't allowed -->
  <path class="deny" d="M752 280 V 304 H 144 V 280"/>
  <g class="deny-mark">
    <line x1="440" y1="296" x2="456" y2="312"/>
    <line x1="456" y1="296" x2="440" y2="312"/>
  </g>

  <!-- one value, traced -->
  <rect class="trace-box" x="8" y="336" width="1184" height="64"/>
  <text class="trace" x="32" y="374">#C11406 &#8594; --color-brand-primary-600 &#8594; --text-color-link &#8594; a { color: var(--text-color-link) }</text>

  <text x="8" y="432">The dashed return path is the one move the architecture forbids. A component never reaches past the semantic layer, and if a rule needs</text>
  <text x="8" y="452">a value the semantic layer doesn't have, that's a missing role, not permission to use a raw value.</text>
</svg>
